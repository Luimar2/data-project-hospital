services:
  mysql:
    image: mysql:8.0
    container_name: hospital_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 1. Cria as bases e permissões
      - ../sql/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro,z
      # 2. Carrega as dashboards, questions e coleções prontas
      - ../sql/metabase_database.sql:/docker-entrypoint-initdb.d/metabase_database.sql:ro,z
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.59.6.1
    container_name: hospital_metabase
    restart: unless-stopped
    ports:
      - "${MB_PORT}:3000"
    environment:
      MB_DB_TYPE: ${MB_DB_TYPE}
      MB_DB_HOST: ${MB_DB_HOST}
      MB_DB_PORT: ${MB_DB_PORT}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MYSQL_USER}
      MB_DB_PASS: ${MYSQL_PASSWORD}
    networks:
      - hospital_network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  hospital_network:
    driver: bridge
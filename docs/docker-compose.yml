version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hospital_dw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hospital_network

  metabase:
    image: metabase/metabase:latest
    container_name: hospital_dw_metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - hospital_network
    depends_on:
      - mysql

volumes:
  mysql_data:
  metabase_data:

networks:
  hospital_network:
    driver: bridge
